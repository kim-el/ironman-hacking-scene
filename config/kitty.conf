# Remote control
allow_remote_control yes

# No annoying close confirmation
confirm_os_window_close 0

# Claude Code-inspired color scheme
hide_window_decorations titlebar-only
background #121016
foreground #e8e3ed

# ANSI colors - Claude Code palette
color0 #1a1620
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #c0caf5
color8 #565f89
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #e8e3ed

# Font
font_family JetBrains Mono
font_size 12.0

# Window padding
window_padding_width 8

# Slight transparency
background_opacity 0.95

# Cursor - Claude purple
cursor #bb9af7
cursor_shape beam

# Selection
selection_foreground #121016
selection_background #bb9af7

# Tab bar
tab_bar_style powerline
tab_bar_edge top
active_tab_foreground #121016
active_tab_background #bb9af7
inactive_tab_foreground #565f89
inactive_tab_background #1a1620

# No bell
enable_audio_bell no

# Keep grid alive
inactive_text_alpha 1.0
